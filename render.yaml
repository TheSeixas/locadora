services:
  - type: web
    runtime: python
    name: bdk-locadora
    plan: free
    buildCommand: python3 scripts/build.py
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: LOCADORA_DB_PATH
        value: data/locadora.sqlite3
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
